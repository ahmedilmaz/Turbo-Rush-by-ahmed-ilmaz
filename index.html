
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TURBO RUSH</title>

  <link rel="stylesheet" href="./style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./script.js" defer></script>
</head>
<body>

  <div id="game">
    <div id="hud">
      <div class="logo">TURBO<span>RUSH</span></div>

      <div class="stats">
        <div class="stat">
          <small>SPEED</small>
          <strong id="speed">0</strong>
          <small>KM/H</small>
        </div>

        <div class="stat">
          <small>DISTANCE</small>
          <strong id="distance">0 m</strong>
        </div>

        <div class="stat">
          <small>COINS</small>
          <strong id="coins">◆ 0</strong>
        </div>
      </div>

      <div id="nitro">
        <span>NITRO</span>
        <div id="nitroTrack">
          <div id="nitroFill"></div>
        </div>
      </div>
    </div>

    <div id="message">
      <div class="panel">
        <div class="eyebrow">NEON HIGHWAY RACING</div>
        <h1 id="title">TURBO <span>RUSH</span></h1>
        <p id="description">Dodge traffic. Collect coins. Rule the highway.</p>
        <button id="start" type="button">START ENGINE ▶</button>
        <p class="help">WASD / ARROWS · SHIFT FOR NITRO</p>
      </div>
    </div>

    <div id="damage"></div>
    <div id="toast"></div>

    <div id="controls">
      <div class="steering">
        <button id="left" type="button" aria-label="Steer left">◀</button>
        <button id="right" type="button" aria-label="Steer right">▶</button>
      </div>

      <div class="driving">
        <button id="boost" type="button">⚡ NITRO</button>
        <button id="brake" type="button">BRAKE</button>
        <button id="accelerate" type="button">ACCELERATE ▲</button>
      </div>
    </div>
  </div>

</body>
</html>
